id: dog-face
title: Dog Face
category: animals
level: 1
minutes: 4
paper: {width: 1, height: 1, start: white_up}
tags: [traditional, simple, face]
description: A floppy-eared dog from one triangle.
steps:
  - op: fold
    line: {through: ["P(0,0)", "P(1,1)"]}
    kind: valley
    move: "P(0,1)"
    title: Make a triangle
    instruction: Fold the top-left corner to the bottom-right corner.
    tips: ["Colour ends up outside."]
    mistakes: ["Corners not lined up."]
    symbol: valley
  - op: rotate
    deg: -45
    title: Long edge up
    instruction: Rotate so the long edge is at the top.
    tips: ["The point at the bottom becomes the chin."]
    mistakes: ["Turning the paper over."]
    symbol: rotate
  - op: fold
    line: {through: ["P(0.35,0.35)", "P(0.2,0)"]}
    kind: valley
    move: "P(0,0)"
    title: Left ear
    instruction: Fold the left corner down to make an ear.
    tips: ["Let the ear hang slightly outward."]
    mistakes: ["Folding the ear inside the face."]
    symbol: valley
  - op: fold
    line: {through: ["P(0.65,0.65)", "P(1,0.8)"]}
    kind: valley
    move: "P(1,1)"
    title: Right ear
    instruction: Fold the right corner down the same way.
    tips: ["Match the left ear for a symmetric face."]
    mistakes: ["Ears at different heights."]
    symbol: valley
  - op: fold
    line: {horizontal: "P(0.9,0.1)"}
    kind: valley
    move: "P(1,0)"
    layers: flap
    flap_count: 1
    title: Nose
    instruction: Fold the top layer of the point up.
    tips: ["Only the front layer folds; the back stays down."]
    mistakes: ["Folding both layers together."]
    symbol: valley
  - op: fold
    line: {horizontal: "P(0.54,0.46)"}
    kind: mountain
    move: "P(0.5,0.5)"
    title: Flat top
    instruction: Fold the top edge behind.
    tips: ["A small fold rounds the head."]
    mistakes: ["Folding too much and hiding the ears."]
    symbol: mountain
  - op: shape
    note: Draw eyes and a nose.
    title: Draw the face
    instruction: Draw eyes and a nose.
    tips: ["Eyes go just below the ears."]
    mistakes: ["Drawing on the wrong side."]
    symbol: inflate
    check: A dog face with floppy ears.
