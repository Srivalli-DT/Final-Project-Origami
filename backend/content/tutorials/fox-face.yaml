id: fox-face
title: Fox Face
category: masks
level: 2
minutes: 5
paper: {width: 1, height: 1, start: white_up}
tags: [face, simple]
description: A fox mask with tall ears and a pointed snout.
steps:
  - op: fold
    line: {through: ["P(0,0)", "P(1,1)"]}
    kind: valley
    move: "P(0,1)"
    title: Make a triangle
    instruction: Fold the square in half diagonally.
    tips: ["Colour ends up outside."]
    mistakes: ["Corners not meeting."]
    symbol: valley
  - op: rotate
    deg: 135
    title: Point up
    instruction: Rotate so the long edge is at the bottom.
    tips: ["The top point will become the forehead."]
    mistakes: ["Turning it over."]
    symbol: rotate
  - op: crease
    line: {through: ["P(1,0)", "P(0.5,0.5)"]}
    kind: valley
    title: Centre crease
    instruction: Fold in half side to side, then unfold.
    tips: ["Only a guide crease."]
    mistakes: ["Leaving it folded."]
    symbol: fold-unfold
  - op: fold
    line: {point_to_point: ["F(1.2071,0.5)", "F(0.78,1.45)"]}
    kind: valley
    move: "F(1.2,0.5)"
    title: Right ear
    instruction: Fold the right corner up past the top point.
    tips: ["The corner sticks out above as an ear."]
    mistakes: ["Lining the corner up with the top point."]
    symbol: valley
  - op: fold
    line: {point_to_point: ["F(-0.2071,0.5)", "F(0.22,1.45)"]}
    kind: valley
    move: "F(-0.2,0.5)"
    layers: paper
    paper_rect: [0.2, 0.2, 1, 1]
    title: Left ear
    instruction: Fold the left corner up the same way.
    tips: ["Both ears the same height."]
    mistakes: ["Uneven ears."]
    symbol: repeat
  - op: fold
    line: {horizontal: "F(0.5,0.95)"}
    kind: valley
    move: "F(0.5,1.19)"
    layers: flap
    flap_count: 1
    title: Snout
    instruction: Fold the top point down to make the snout.
    tips: ["The point hangs below the face."]
    mistakes: ["Folding the ears down too."]
    symbol: valley
  - op: shape
    note: Draw eyes and a nose on the snout.
    title: Draw the face
    instruction: Draw eyes and a nose.
    tips: ["The nose goes at the snout tip."]
    mistakes: ["Eyes too close together."]
    symbol: inflate
    check: A fox face with tall ears.
